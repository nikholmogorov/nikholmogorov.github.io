name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: 20

  # Projects excluded from GitHub Pages deployment.
  # Add one project path per line.
  EXCLUDED_PROJECTS: |
    projects/classifieds

jobs:
  build-and-prepare:
    name: Build and prepare deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ------------------------------------------------------------
      # Copy portfolio root
      # ------------------------------------------------------------

      - name: Prepare deployment directory
        shell: bash
        run: |
          set -e

          mkdir -p deploy

          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='projects' \
            --exclude='deploy' \
            ./ deploy/

      # ------------------------------------------------------------
      # Process all projects automatically
      # ------------------------------------------------------------

      - name: Process projects
        shell: bash
        run: |
          set -e

          is_excluded_project() {
            local candidate="${1%/}"
            local excluded_path

            while IFS= read -r excluded_path; do
              excluded_path="${excluded_path%/}"

              [ -z "$excluded_path" ] && continue

              if [ "$candidate" = "$excluded_path" ]; then
                return 0
              fi
            done <<< "$EXCLUDED_PROJECTS"

            return 1
          }

          mkdir -p deploy/projects

          for project_path in projects/*; do

            if [ ! -d "$project_path" ]; then
              continue
            fi

            # Skip explicitly excluded projects.
            if is_excluded_project "$project_path"; then
              echo "Skipping excluded project: $project_path"
              continue
            fi

            project_name=$(basename "$project_path")

            echo ""
            echo "========================================"
            echo "Processing: $project_name"
            echo "========================================"

            is_buildable=false

            if [ -f "$project_path/package.json" ]; then

              echo "package.json found."

              if node -e "
                const fs = require('fs');
                const path = process.argv[1];
                const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));

                process.exit(
                  pkg.scripts && typeof pkg.scripts.build === 'string'
                    ? 0
                    : 1
                );
              " "$project_path/package.json"; then

                is_buildable=true
                echo "Build script found."

              else

                echo "No build script found."

              fi

            else

              echo "No package.json found."

            fi

            # ------------------------------------------------------
            # Buildable project
            # ------------------------------------------------------

            if [ "$is_buildable" = true ]; then

              echo "Type: Buildable project"
              echo "Building..."

              (
                cd "$project_path"

                if [ -f package-lock.json ]; then
                  npm ci
                else
                  npm install
                fi

                npm run build
              )

              if [ ! -d "$project_path/dist" ]; then
                echo "ERROR: $project_name has no dist/ directory."
                exit 1
              fi

              if [ ! -f "$project_path/dist/index.html" ]; then
                echo "ERROR: $project_name has no dist/index.html."
                exit 1
              fi

              mkdir -p "deploy/projects/$project_name"

              cp -r \
                "$project_path/dist/." \
                "deploy/projects/$project_name/"

              echo "Build copied successfully."

            # ------------------------------------------------------
            # Static project
            # ------------------------------------------------------

            else

              echo "Type: Static project"
              echo "Copying files..."

              mkdir -p "deploy/projects/$project_name"

              cp -r \
                "$project_path/." \
                "deploy/projects/$project_name/"

              echo "Static project copied successfully."

            fi

          done

      # ------------------------------------------------------------
      # Verify deployment
      # ------------------------------------------------------------

      - name: Verify deployment
        shell: bash
        run: |
          set -e

          is_excluded_project() {
            local candidate="${1%/}"
            local excluded_path

            while IFS= read -r excluded_path; do
              excluded_path="${excluded_path%/}"

              [ -z "$excluded_path" ] && continue

              if [ "$candidate" = "$excluded_path" ]; then
                return 0
              fi
            done <<< "$EXCLUDED_PROJECTS"

            return 1
          }

          echo ""
          echo "========================================"
          echo "Deployment contents"
          echo "========================================"

          find deploy -maxdepth 4 -type f | sort

          echo ""
          echo "========================================"
          echo "Verifying projects"
          echo "========================================"

          for project_path in projects/*; do

            if [ ! -d "$project_path" ]; then
              continue
            fi

            if is_excluded_project "$project_path"; then
              echo "SKIPPED: $project_path"
              continue
            fi

            project_name=$(basename "$project_path")

            if [ ! -f "deploy/projects/$project_name/index.html" ]; then
              echo "ERROR: Missing index.html for $project_name"
              exit 1
            fi

            echo "OK: $project_name"

          done

          echo ""
          echo "========================================"
          echo "All projects verified successfully."
          echo "========================================"

      # ------------------------------------------------------------
      # GitHub Pages deployment
      # ------------------------------------------------------------

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: deploy
          clean: true
