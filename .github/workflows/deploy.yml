name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: 20

jobs:
  build-and-prepare:
    name: Build and prepare deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Prepare deployment directory
        run: |
          mkdir -p deploy/projects

      - name: Process projects
        shell: bash
        run: |
          set -e

          for project_path in projects/*; do
            if [ ! -d "$project_path" ]; then
              continue
            fi

            project_name=$(basename "$project_path")

            echo ""
            echo "========================================"
            echo "Processing: $project_name"
            echo "========================================"

            if [ -f "$project_path/package.json" ]; then
              echo "Type: Vite/Node project"
              echo "Building..."

              cd "$project_path"

              npm ci
              npm run build

              cd ../..

              if [ ! -d "$project_path/dist" ]; then
                echo "ERROR: $project_name does not contain dist/"
                exit 1
              fi

              mkdir -p "deploy/projects/$project_name"

              cp -r "$project_path/dist/." \
                "deploy/projects/$project_name/"

              echo "Build copied successfully."

            else
              echo "Type: Static project"
              echo "Copying files..."

              mkdir -p "deploy/projects/$project_name"

              cp -r "$project_path/." \
                "deploy/projects/$project_name/"

              echo "Static project copied successfully."
            fi
          done

      - name: Copy portfolio root
        shell: bash
        run: |
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='projects' \
            ./ deploy/

      - name: Verify deployment
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo "Deployment contents"
          echo "========================================"

          find deploy -maxdepth 3 -type f | sort

          echo ""
          echo "========================================"
          echo "Verifying projects"
          echo "========================================"

          for project_path in projects/*; do
            if [ ! -d "$project_path" ]; then
              continue
            fi

            project_name=$(basename "$project_path")

            if [ ! -f "deploy/projects/$project_name/index.html" ]; then
              echo "ERROR: Missing index.html for $project_name"
              exit 1
            fi

            echo "OK: $project_name"
          done

          echo ""
          echo "All projects verified successfully."

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment
          path: deploy
          if-no-files-found: error

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-and-prepare

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download deployment
        uses: actions/download-artifact@v4
        with:
          name: deployment
          path: deploy

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: deploy
          clean: true