name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: 20

jobs:
  build-and-prepare:
    name: Build and prepare deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ------------------------------------------------------------
      # Copy portfolio root
      # ------------------------------------------------------------

      - name: Prepare deployment directory
        shell: bash
        run: |
          set -e

          mkdir -p deploy

          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='projects' \
            --exclude='deploy' \
            ./ deploy/

      # ------------------------------------------------------------
      # Process all projects automatically
      #
      # Rules:
      #   package.json + scripts.build -> build project
      #   everything else              -> static project
      # ------------------------------------------------------------

      - name: Process projects
        shell: bash
        run: |
          set -e

          mkdir -p deploy/projects

          for project_path in projects/*; do

            # Skip anything that is not a directory
            if [ ! -d "$project_path" ]; then
              continue
            fi

            project_name=$(basename "$project_path")

            echo ""
            echo "========================================"
            echo "Processing: $project_name"
            echo "========================================"

            # ------------------------------------------------------
            # Determine project type
            # ------------------------------------------------------

            is_buildable=false

            if [ -f "$project_path/package.json" ]; then

              echo "package.json found."

              if node -e "
                const fs = require('fs');
                const path = process.argv[1];

                const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));

                process.exit(
                  pkg.scripts && typeof pkg.scripts.build === 'string'
                    ? 0
                    : 1
                );
              " "$project_path/package.json"; then

                is_buildable=true
                echo "Build script found."

              else

                echo "No build script found."

              fi

            else

              echo "No package.json found."

            fi

            # ------------------------------------------------------
            # Buildable project
            # ------------------------------------------------------

            if [ "$is_buildable" = true ]; then

              echo "Type: Buildable project"
              echo "Building..."

              (
                cd "$project_path"

                if [ -f package-lock.json ]; then
                  echo "Using npm ci..."
                  npm ci
                else
                  echo "No package-lock.json found."
                  echo "Using npm install..."
                  npm install
                fi

                npm run build
              )

              # ----------------------------------------------------
              # Verify build output
              # ----------------------------------------------------

              if [ ! -d "$project_path/dist" ]; then
                echo ""
                echo "ERROR: $project_name has a build script,"
                echo "but no dist/ directory was created."
                echo ""
                exit 1
              fi

              if [ ! -f "$project_path/dist/index.html" ]; then
                echo ""
                echo "ERROR: $project_name build completed,"
                echo "but dist/index.html was not found."
                echo ""
                exit 1
              fi

              # ----------------------------------------------------
              # Copy build output
              # ----------------------------------------------------

              mkdir -p "deploy/projects/$project_name"

              cp -r \
                "$project_path/dist/." \
                "deploy/projects/$project_name/"

              echo "Build copied successfully."

            # ------------------------------------------------------
            # Static project
            # ------------------------------------------------------

            else

              echo "Type: Static project"
              echo "Copying files..."

              mkdir -p "deploy/projects/$project_name"

              cp -r \
                "$project_path/." \
                "deploy/projects/$project_name/"

              echo "Static project copied successfully."

            fi

          done

      # ------------------------------------------------------------
      # Verify deployment
      # ------------------------------------------------------------

      - name: Verify deployment
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo "Deployment contents"
          echo "========================================"

          find deploy -maxdepth 4 -type f | sort

          echo ""
          echo "========================================"
          echo "Verifying projects"
          echo "========================================"

          for project_path in projects/*; do

            if [ ! -d "$project_path" ]; then
              continue
            fi

            project_name=$(basename "$project_path")

            if [ ! -f "deploy/projects/$project_name/index.html" ]; then
              echo ""
              echo "ERROR: Missing index.html for $project_name"
              echo ""
              exit 1
            fi

            echo "OK: $project_name"

          done

          echo ""
          echo "========================================"
          echo "All projects verified successfully."
          echo "========================================"

      # ------------------------------------------------------------
      # GitHub Pages deployment
      # ------------------------------------------------------------

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: deploy
          clean: true